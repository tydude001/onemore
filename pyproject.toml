[project]
name = "onemore"
version = "0.1.0"
description = "A self-hosted strength-training planner that reads your Strong app exports and adjusts next week's loads. Stdlib Python, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []
keywords = ["fitness", "self-hosted", "stdlib", "strength-training", "strong-app", "workout-tracker"]

[project.urls]
Homepage = "https://github.com/tydude001/onemore"
Repository = "https://github.com/tydude001/onemore"
Issues = "https://github.com/tydude001/onemore/issues"

[project.scripts]
onemore = "onemore.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Dates are local on purpose: a week boundary and every dated record come off
# date.today() in the machine's (or container's TZ) local time, never UTC.
extend-ignore = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
