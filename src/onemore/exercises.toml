# Two pulldowns, two training maxes: the cable station and the selectorized machine are
# different load scales, the same reason the MTS ids are kept apart. Split 2026-09-21. The
# cable keeps the bare id because the TM already stored under `lat_pulldown` was set off the
# cable, and `Store.remap_exercise_ids` leaves a split id's state where it is -- so the
# machine's history moves on the next import and nothing else has to.
[lat_pulldown]
name = "Lat Pulldown (Cable)"
pattern = "vertical_pull"
equipment = "cable"
step_lb = 10
# "Front Pulldown" (3 sessions, 30-40 lb, 2023) sat beside the machine pulldown twice and
# the cable once, so it duplicates neither; filed with the cable as a guess. Only 10 sets.
aliases.strong = ["Lat Pulldown (Cable)", "Lat Pulldown - Wide Grip (Cable)", "Front Pulldown"]

[machine_lat_pulldown]
name = "Lat Pulldown (Machine)"
pattern = "vertical_pull"
equipment = "machine"
step_lb = 10  # 7 of its 10 load steps are 10 lb (scripts/derive_increments.py)
aliases.strong = ["Lat Pulldown (Machine)"]

[chest_fly]
name = "Chest Fly (Machine)"
pattern = "horizontal_push"
equipment = "machine"
step_lb = 10
aliases.strong = ["Chest Fly", "Butterfly (Pec Deck)"]

[machine_bicep_curl]
name = "Machine Bicep Curl"
pattern = "isolation"
equipment = "machine"
step_lb = 2.5  # the only 2.5 lb stack in the history; 6 of its 12 steps are 2.5
aliases.strong = ["Bicep Curl (Machine)"]

[preacher_curl]
name = "Preacher Curl"
pattern = "isolation"
equipment = "machine"
step_lb = 5
aliases.strong = ["Preacher Curl (Machine)"]

[triceps_extension_machine]
name = "Triceps Extension (Machine)"
pattern = "isolation"
equipment = "machine"
step_lb = 10
# "Triceps Extension" is the same machine under Strong's older name: the two overlap in
# time and their load ranges agree (scripts/derive_increments.py).
aliases.strong = ["Triceps Extension (Machine)", "Triceps Extension"]

[tricep_press_machine]
name = "Tricep Press Machine"
pattern = "isolation"
equipment = "machine"
step_lb = 10
# Deliberately NOT merged into triceps_extension_machine: it runs 2022-06 to 2023-09,
# ending as that one begins, and reaches 167.5 lb where that one reaches 130.
aliases.strong = ["Tricep Press Machine"]

[crunch_machine]
name = "Crunch (Machine)"
pattern = "core"
equipment = "machine"
step_lb = 10
aliases.strong = ["Crunch (Machine)"]

