# Canonical exercise catalog. `aliases.strong` are exact Strong export names.
# Unknown source names are slugified and flagged by `onemore status --unmapped`.
#
# Equipment fields — the reason this file, not a constant, owns load arithmetic:
#
#   equipment    machine | mts | smith | dumbbell | cable | barbell | bodyweight | cardio
#   step_lb      smallest load jump, in lb, because that is how the plates and pin
#                stacks at this gym are marked. Rounding happens in lb and only at
#                render time; the store is kg. Derived from the export where there was
#                enough history to derive it — reproduce with scripts/derive_increments.py.
#   ceiling_lb   the load above which this exercise cannot go. Set ONLY where the limit
#                is actually known (the dumbbell rack). It is deliberately unset for
#                every machine: the export's heaviest logged load is a floor on the
#                stack top, not the stack top, and `dumbbell_ceiling` stays silent
#                rather than invent one. Read them off the machines to fill these in.
#   smith_tare_lb  the Smith bar's own counterbalanced weight. Unset everywhere: it
#                varies by machine and branch, Strong logs added load only, and it has
#                to be measured. Until it is, a Smith e1RM compares only to itself.
#   available    false = the gym does not have it (Planet Fitness: no barbell, no rack).
#                Kept in the catalog so old history still resolves and so a program can
#                be checked against the equipment rather than silently prescribing air.

# -- Planet Fitness: selectorized machines -------------------------------------------

