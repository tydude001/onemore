name: Bug
description: onemore ran, and did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach your Strong or Health export here** — issues are
        public and edit history stays visible even if you delete a comment
        later. Describe the rows instead: a wrong rounding, a rule that
        fired (or didn't) when it shouldn't have, a load that came out
        under the wrong ceiling.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The CLI command, or what you did on the web app.
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: |
        Describe the shape of any data involved (an exercise, a rule name,
        a week number) rather than pasting the export or a database row.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `uv run onemore --version`
      placeholder: onemore 0.1.0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional — Python version, OS, or a stack trace with any data stripped out.
